[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codedna"
version = "0.1.0"
description = "Change-impact analysis and regression test selection for Java projects (FYP prototype)."
readme = "README.md"
requires-python = ">=3.11"
# Add runtime dependencies only when a milestone needs them, and record why
# in docs/DECISIONS.md. Tree-sitter: Java parsing for method-level mapping (D-008).
dependencies = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-java>=0.23.5,<0.24",
]

[project.optional-dependencies]
# scikit-learn: failure-prediction models for Milestone 4 (D-022).
ml = ["scikit-learn>=1.4"]
# FastAPI + uvicorn: local API for the CodeDNA IDE (D-028).
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# Matplotlib: optional saved-report figures for Milestones 4-5 (D-038).
plots = ["matplotlib>=3.8"]
# Windows desktop distribution; never needed by the installed analysis runtime.
desktop = ["pyinstaller==6.22.0"]
dev = ["pytest>=8", "scikit-learn>=1.4", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
codedna = "codedna.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["codedna*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
markers = ["maven: end-to-end tests that run real Maven (enable with --run-maven)"]
