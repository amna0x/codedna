[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codedna"
version = "0.1.0"
description = "Change-impact analysis and regression test selection for Java projects (FYP prototype)."
readme = "README.md"
requires-python = ">=3.11"
# Milestone 0/1 uses only the standard library. Add runtime dependencies
# only when a milestone needs them, and record why in docs/DECISIONS.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
codedna = "codedna.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["codedna*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
