name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CodeDNA
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: CLI smoke test
        run: codedna --version

  sample-java-project:
    name: Sample Java project (Maven + JUnit 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        working-directory: examples/sample-java-project
        run: mvn --batch-mode --no-transfer-progress verify

  ide-extension:
    name: CodeDNA IDE extension (TypeScript build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ide/package-lock.json
      - name: Install (no install scripts, no Electron download)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check and compile the extension
        run: npm run build:extension
      - name: Check packaged core discovery
        run: npm run test:runtime --workspace electron-app

  maven-integration:
    name: CodeDNA + real Maven/JaCoCo (integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: examples/sample-java-project/pom.xml
      - name: Install CodeDNA
        run: python -m pip install -e ".[dev]"
      - name: Run Maven integration tests
        run: python -m pytest -m maven --run-maven -v
